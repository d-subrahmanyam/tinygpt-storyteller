[project]
name = "tinygpt-storyteller"
version = "0.1.0"
description = "Build and train a tiny GPT on TinyStories, then write stories with it in Story Studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5",
    "tiktoken>=0.14",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "matplotlib>=3.11",
]

[project.optional-dependencies]
# Pick exactly one, for your GPU: uv sync --extra rocm | cuda | cpu
rocm = ["torch==2.14.1", "triton-rocm"]
cuda = ["torch==2.14.1"]
cpu = ["torch==2.14.1"]

[tool.uv]
package = false
conflicts = [[{ extra = "rocm" }, { extra = "cuda" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-cpu", extra = "cpu" },
]
triton-rocm = { index = "pytorch-rocm", extra = "rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
